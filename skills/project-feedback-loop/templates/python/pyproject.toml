[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "python-feedback-loop-template"
version = "0.1.0"
description = "Sample Python project scaffolded for a strict automated feedback loop"
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
dev = [
  "black",
  "hypothesis",
  "mypy",
  "nox",
  "pre-commit",
  "pytest",
  "ruff",
  "watchfiles"
]
agent = [
  "langchain",
  "langgraph",
  "langsmith"
]

[tool.hatch.build.targets.wheel]
packages = ["src/example_pkg"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "RUF"]

[tool.black]
line-length = 100

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_ignores = true
warn_redundant_casts = true
disallow_any_generics = true

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
