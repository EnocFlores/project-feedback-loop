default_install_hook_types: [pre-commit, pre-push]

repos:
  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check
        entry: python -m ruff check . --fix
        language: system
        pass_filenames: false

      - id: black-check
        name: black check
        entry: python -m black --check .
        language: system
        pass_filenames: false

      - id: mypy
        name: mypy
        entry: python -m mypy .
        language: system
        pass_filenames: false

      - id: pytest
        name: pytest
        entry: python -m pytest -q
        language: system
        pass_filenames: false

